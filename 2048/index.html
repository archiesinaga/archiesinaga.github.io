<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Prehistoric Edition | Archie's Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="brand-row">
        <a href="../" class="back-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Portfolio
        </a>
        <h1 class="game-title">2048</h1>
      </div>
      <div class="scores-row">
        <div class="score-box">
          <div class="score-title">SCORE</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-title">BEST</div>
          <div class="score-value" id="best-score">0</div>
        </div>
        <button class="btn-restart" id="restart-btn" title="Restart Game">Restart</button>
      </div>
    </header>

    <div class="game-instructions">
      Join the numbers and reach the <strong>2048 tile!</strong> Use arrow keys, WASD, or swipe on mobile.
    </div>

    <div class="grid-board" id="grid-board">
      <!-- 16 grid cells will be placed here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
